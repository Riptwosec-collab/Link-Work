<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading NOC Log Center PRO</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020914; color: #f4f8ff; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    .spinner { width: 42px; height: 42px; margin: 0 auto 16px; border: 4px solid rgba(99,199,255,.2); border-top-color: #63c7ff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #9bb0c9; }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>NOC Log Center PRO</h1>
    <p id="status">กำลังโหลดระบบ...</p>
  </main>
  <script>
    (async () => {
      try {
        const paths = ["bootstrap/app.part1.b64", "bootstrap/app.part2.b64"];
        const parts = await Promise.all(paths.map(async (path) => {
          const response = await fetch(path, { cache: "no-store" });
          if (!response.ok) throw new Error(`โหลด ${path} ไม่สำเร็จ`);
          return (await response.text()).trim();
        }));
        const binary = atob(parts.join(""));
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const sourceHtml = await new Response(stream).text();
        const enhancedHtml = sourceHtml
          .replace("</head>", '  <link rel="stylesheet" href="browser-tools.css">\n</head>')
          .replace("</body>", '  <script src="browser-tools.js"></' + 'script>\n</body>');
        document.open();
        document.write(enhancedHtml);
        document.close();
      } catch (error) {
        document.getElementById("status").textContent = `โหลดระบบไม่สำเร็จ: ${error.message}`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
