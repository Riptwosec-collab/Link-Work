<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061326">
  <title>LinkWork</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020914;color:#f4f8ff;font-family:system-ui,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .loading{width:min(560px,100%);padding:22px;border:1px solid #235a8f;border-radius:18px;background:#071a31;box-shadow:0 18px 48px #0008}
    h1{margin:0 0 8px;color:#fff1b8;font-size:1.3rem}p{margin:0;color:#9eb3ca;line-height:1.6}.error{color:#ff9aaa;white-space:pre-wrap}
  </style>
  <link rel="stylesheet" href="assets/theme-upgrade.css?v=20260806-1708">
  <link rel="stylesheet" href="assets/linkwork-neon-theme.css?v=20260807-1105">
</head>
<body>
  <div class="loading"><h1>LinkWork</h1><p id="status">กำลังโหลดหน้าเว็บ…</p></div>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        const version='20260806-1645';
        const paths=[1,2,3,4,5].map(n=>`assets/linkwork-payload-${n}.txt?v=${version}`);
        const parts=await Promise.all(paths.map(async path=>{
          const response=await fetch(path,{cache:'no-store'});
          if(!response.ok)throw new Error(`โหลด ${path} ไม่สำเร็จ (${response.status})`);
          return (await response.text()).replace(/\s+/g,'');
        }));
        const base64=parts.join('');
        if(!base64||base64.length%4!==0)throw new Error(`ข้อมูลหน้าเว็บไม่ครบ (${base64.length} ตัวอักษร)`);
        const bytes=Uint8Array.from(atob(base64),char=>char.charCodeAt(0));
        if(typeof DecompressionStream!=='function')throw new Error('เบราว์เซอร์ไม่รองรับการคลายไฟล์ กรุณาใช้ Chrome หรือ Edge เวอร์ชันล่าสุด');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let html=await new Response(stream).text();

        html=html.replace('ลิงก์งาน','Work Links').replace('ข้อความใช้บ่อย','Quick Copy').replace('แปลง Log','Log Converter');

        html=html.replace(
          '<label><span class="label">ข้อความในวงเล็บ</span><input class="input" id="trafficBracket" placeholder="BANGMOD-TH"></label>',
          '<label><span class="label">ข้อความในวงเล็บ</span><select class="input" id="trafficBracket"><option value="">เลือกประเภท</option><option value="TRUE">TRUE</option><option value="UIH">UIH</option><option value="Google">Google</option><option value="Private">Private</option><option value="Amazon">Amazon</option></select></label>'
        );
        html=html.replace(
          'if(bracket)$("#trafficBracket").value=bracket[1].trim();',
          'if(bracket){const value=bracket[1].trim(),select=$("#trafficBracket"),option=[...select.options].find(item=>item.value.toLowerCase()===value.toLowerCase());if(option)select.value=option.value;}'
        );
        html=html.replace(
          '["trafficTime","trafficSourceIp","trafficDestinationIp","trafficBracket"].forEach(id=>$("#"+id).addEventListener("input",convertTrafficLog));',
          '["trafficTime","trafficSourceIp","trafficDestinationIp"].forEach(id=>$("#"+id).addEventListener("input",convertTrafficLog));$("#trafficBracket").addEventListener("change",convertTrafficLog);'
        );

        const utilityUrl='http://10.20.2.17/project/'+'check'+'passwd.aspx';
        const dhcpUrl='https://dhcp-automation-pro.vercel.app/#dhcp';
        const nightUrl='https://night-d1-riptwosec.vercel.app/';
        const helpdeskV2Url='https://10.1.18.2/helpdesk/WebObjects/Helpdesk.woa/wa/TicketActions/view?tab=group';
        const monthlyItem='        {icon:"MON", name:"Monthly", url:"http://10.1.9.170/monthly/", host:"10.1.9.170"}';
        const missing=[];
        if(!html.includes(utilityUrl))missing.push('        {icon:"KEY", name:"ตรวจรหัส", url:"'+utilityUrl+'", host:"10.20.2.17"}');
        if(!html.includes(dhcpUrl))missing.push('        {icon:"DHCP", name:"Dhcp Auto", url:"'+dhcpUrl+'", host:"dhcp-automation-pro.vercel.app"}');
        if(!html.includes(nightUrl))missing.push('        {icon:"D1", name:"Night D1", url:"'+nightUrl+'", host:"night-d1-riptwosec.vercel.app"}');
        if(!html.includes(helpdeskV2Url))missing.push('        {icon:"HD2", name:"Web Helpdesk V2", url:"'+helpdeskV2Url+'", host:"10.1.18.2"}');
        if(missing.length)html=html.replace(monthlyItem,missing.join(',\n')+',\n'+monthlyItem);

        const historySection=`    <section class="history glass">
      <div class="head"><div><h2>ประวัติการคัดลอก</h2><div class="sub">เก็บล่าสุด 30 รายการใน Browser</div></div><button class="btn red" id="clearHistory" type="button">ล้างประวัติ</button></div>
      <div class="history-list" id="history"></div>
    </section>
`;
        html=html.replace(historySection,'');
        html=html.replace('      function getHistory(){return JSON.parse(store.get(HKEY)||"[]")}','      function getHistory(){return []}');
        html=html.replace('      function addHistory(text){const h=getHistory();h.unshift({text,at:new Date().toISOString()});store.set(HKEY,JSON.stringify(h.slice(0,30)));renderHistory()}','      function addHistory(text){}');
        html=html.replace(
          '      function renderHistory(){const h=getHistory(), box=$("#history"); box.innerHTML=h.length ? h.map((x,i)=>`<div class="history-item"><small>${new Date(x.at).toLocaleString("th-TH")}</small><pre>${esc(x.text)}</pre><div class="actions"><button class="btn" data-recopy="${i}" type="button">คัดลอกซ้ำ</button></div></div>`).join("") : \'<div class="empty">ยังไม่มีประวัติการคัดลอก</div>\'; $$(\'[data-recopy]\').forEach(btn=>btn.onclick=()=>copy(h[+btn.dataset.recopy].text))}',
          '      function renderHistory(){}'
        );
        html=html.replace('      $("#clearHistory").onclick=()=>{if(confirm("ล้างประวัติทั้งหมดหรือไม่?")){store.remove(HKEY); renderHistory()}};\n','');
        html=html.replace(
          '      renderLinks(); renderStaff(); renderQuickLists(); load(); previews(); renderHistory(); $("#copyCount").textContent=getCopy(); setInterval(previews,1000);',
          '      renderLinks(); renderStaff(); renderQuickLists(); load(); previews(); $("#copyCount").textContent=getCopy(); setInterval(previews,1000);'
        );
        html=html.replace('      const workLinks=[','      store.remove(HKEY);\n\n      const workLinks=[');

        const themeTag='<link rel="stylesheet" href="assets/theme-upgrade.css?v=20260806-1708">';
        const securityStyleTag='<link rel="stylesheet" href="assets/security-guide.css?v=20260807-1245">';
        const neonThemeTag='<link rel="stylesheet" href="assets/linkwork-neon-theme.css?v=20260807-1105">';
        html=html.replace('</head>',themeTag+securityStyleTag+neonThemeTag+'</head>');
        const cmTag='<scr'+'ipt src="assets/cm-generator-v2.js?v=20260807-0925"></scr'+'ipt>';
        const ipPhoneTag='<scr'+'ipt src="assets/ip-phone-guide-polished.js?v=20260807-1145"></scr'+'ipt>';
        const ipPhoneCiscoTag='<scr'+'ipt src="assets/ip-phone-cisco-patch.js?v=20260807-1535"></scr'+'ipt>';
        const passwordGateTag='<scr'+'ipt src="assets/password-gate.js?v=20260807-1715"></scr'+'ipt>';
        const ownerPakTag='<scr'+'ipt src="assets/owner-pak-upgrade.js?v=20260807-1215"></scr'+'ipt>';
        const securityTags=[
          'assets/security-topic-mac.js',
          'assets/security-topic-dai.js',
          'assets/security-topic-acl.js',
          'assets/security-topic-stp.js',
          'assets/security-topic-null0.js',
          'assets/security-topic-sticky.js',
          'assets/security-guide-core.js'
        ].map(src=>'<scr'+'ipt src="'+src+'?v=20260807-1245"></scr'+'ipt>').join('');
        const logUiTag='<scr'+'ipt src="assets/log-ui-patch.js?v=20260807-1035"></scr'+'ipt>';
        html=html.replace('</body>',cmTag+ipPhoneTag+ipPhoneCiscoTag+passwordGateTag+ownerPakTag+securityTags+logUiTag+'</body>');

        const requiredLinks=[utilityUrl,dhcpUrl,nightUrl,helpdeskV2Url];
        if(requiredLinks.some(url=>!html.includes(url)))throw new Error('เพิ่มปุ่มลิงก์ไม่สำเร็จ');
        if(html.includes('ประวัติการคัดลอก')||html.includes('id="clearHistory"')||html.includes('id="history"'))throw new Error('ลบประวัติการคัดลอกไม่สำเร็จ');
        if(!html.includes('function addHistory(text){}')||!html.includes('store.remove(HKEY);'))throw new Error('ปิดการบันทึกประวัติไม่สำเร็จ');
        if(!html.includes('assets/cm-generator-v2.js'))throw new Error('เพิ่มเครื่องมือสร้างข้อความ CM ไม่สำเร็จ');
        if(!html.includes('assets/theme-upgrade.css'))throw new Error('โหลดธีมใหม่ไม่สำเร็จ');
        if(!html.includes('assets/linkwork-neon-theme.css'))throw new Error('โหลดธีม Neon ใหม่ไม่สำเร็จ');
        if(!html.includes('assets/ip-phone-guide-polished.js')||!html.includes('assets/ip-phone-cisco-patch.js'))throw new Error('เพิ่มคู่มือ Cisco IP Phone ไม่สำเร็จ');
        if(!html.includes('assets/password-gate.js'))throw new Error('โหลด Password Gate ไม่สำเร็จ');
        if(!html.includes('assets/owner-pak-upgrade.js'))throw new Error('อัปเกรดคนดูแลแต่ละ Pak ไม่สำเร็จ');
        if(!html.includes('assets/security-guide-core.js')||!html.includes('assets/security-topic-sticky.js'))throw new Error('เพิ่ม Security Knowledge Base ไม่สำเร็จ');
        if(!html.includes('assets/log-ui-patch.js'))throw new Error('ปรับ Log UI ไม่สำเร็จ');

        document.open();document.write(html);document.close();
      }catch(error){
        status.className='error';
        status.textContent=`ไม่สามารถโหลดหน้าเว็บได้: ${error.message}\n\nกรุณากด Ctrl + F5 แล้วลองใหม่`;
      }
    })();
  </script>
</body>
</html>
