name: Add quick copy panels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-quick-copy-panels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-linkwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add quick copy section and popups
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'id="openAdviceModal"' in html and 'id="openConfigModal"' in html:
              print("Quick copy panels are already installed")
              raise SystemExit(0)

          css = '''
          .quick-tools{margin-top:14px;padding:17px}
          .quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
          .quick-grid .work-link{width:100%;cursor:pointer;text-align:left}
          .message-modal{width:min(980px,100%)}
          .message-list{display:grid;gap:12px}
          .message-card{padding:14px;border:1px solid rgba(84,177,255,.26);border-radius:14px;background:#020c1a}
          .message-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
          .message-card h3{margin:0;font-size:1rem;color:#eaf4ff}
          .message-card pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;color:#dcecff;font:inherit}
          .message-card .btn{flex:0 0 auto;min-width:92px}
          @media(max-width:900px){.quick-grid{grid-template-columns:1fr}}
          @media(max-width:620px){.message-card-head{flex-direction:column}.message-card .btn{width:100%}}
          '''
          html = html.replace("</style>", css + "\n</style>", 1)

          staff_button_pattern = re.compile(r'\s*<button class="work-link" id="openStaffModal".*?</button>\n?', re.S)
          html, removed = staff_button_pattern.subn("", html, count=1)
          if removed != 1:
              raise SystemExit("Could not move the UIH staff button")

          section = '''</section>
          <section class="quick-tools glass" aria-labelledby="quickToolsTitle">
            <div class="section-title"><div><h2 id="quickToolsTitle">ข้อความใช้บ่อย</h2><p>เปิดรายการแล้วกด Copy แยกแต่ละข้อความ</p></div></div>
            <div class="quick-grid">
              <button class="work-link" id="openStaffModal" type="button"><span class="link-icon">UIH</span><span class="link-copy"><span class="link-name">รายชื่อเจ้าหน้าที่ UIH</span><span class="link-url">ชื่อ · Line ID · Copy</span></span><span class="link-arrow" aria-hidden="true">›</span></button>
              <button class="work-link" id="openAdviceModal" type="button"><span class="link-icon">TIP</span><span class="link-copy"><span class="link-name">แนะนำเจ้าหน้าที่</span><span class="link-url">ขั้นตอนและข้อความแนะนำ</span></span><span class="link-arrow" aria-hidden="true">›</span></button>
              <button class="work-link" id="openConfigModal" type="button"><span class="link-icon">CFG</span><span class="link-copy"><span class="link-name">Config ใช้บ่อย</span><span class="link-url">Cisco · Windows · Troubleshooting</span></span><span class="link-arrow" aria-hidden="true">›</span></button>
            </div>
          </section>
          <div class="stats">'''
          anchor = '</section>\n<div class="stats">'
          if anchor not in html:
              raise SystemExit("Work links section anchor not found")
          html = html.replace(anchor, section, 1)

          modal_anchor = '<div class="toast" id="toast"></div>'
          modals = '''<div class="modal-bg" id="adviceModal">
            <div class="modal glass message-modal">
              <div class="modal-top"><div><h2>แนะนำเจ้าหน้าที่</h2><p class="sub">เลือก Copy เฉพาะข้อความที่ต้องการ</p></div><button class="btn" id="closeAdviceModal" type="button">ปิด</button></div>
              <div class="message-list" id="adviceList"></div>
            </div>
          </div>
          <div class="modal-bg" id="configModal">
            <div class="modal glass message-modal">
              <div class="modal-top"><div><h2>Config ใช้บ่อย</h2><p class="sub">คำสั่งและขั้นตอนที่ใช้งานบ่อย</p></div><button class="btn" id="closeConfigModal" type="button">ปิด</button></div>
              <div class="message-list" id="configList"></div>
            </div>
          </div>
          <div class="toast" id="toast"></div>'''
          if modal_anchor not in html:
              raise SystemExit("Toast anchor not found")
          html = html.replace(modal_anchor, modals, 1)

          copy_targets = [
              ("พรสิงห์", "เจ้าหน้าที่ UIH คุณพรสิงห์ แจ้งว่า "),
              ("จีราวัช", "เจ้าหน้าที่ UIH คุณจีราวัช แจ้งว่า "),
              ("กนกอร", "เจ้าหน้าที่ UIH คุณกนกอร แจ้งว่า "),
              ("สรชัย", "เจ้าหน้าที่ UIH คุณสรชัย แจ้งว่า "),
              ("พิมพ์ใจ", "เจ้าหน้าที่ UIH คุณพิมพ์ใจ แจ้งว่า "),
              ("ธัญญาศิริ", "เจ้าหน้าที่ UIH คุณธัญญาศิริ แจ้งว่า "),
              ("วิฑวัสซ์", "เจ้าหน้าที่ UIH คุณวิฑวัสซ์ แจ้งว่า "),
              ("พิมพ์มาดา", "เจ้าหน้าที่ UIH คุณพิมพมาดา แจ้งว่า "),
              ("จุไรรัตน์", "เจ้าหน้าที่ UIH คุณจุไรรัตน์ แจ้งว่า "),
              ("พิชิต", "เจ้าหน้าที่ UIH คุณพิชิต แจ้งว่า "),
              ("ฉัตรทิพย์", "เจ้าหน้าที่ UIH คุณฉัตรทิพย์ แจ้งว่า "),
              ("ไพฑูรย์", "เจ้าหน้าที่ UIH คุณไพฑูรย์ แจ้งว่า "),
              ("มลฤดี", "เจ้าหน้าที่ UIH คุณมลฤดี แจ้งว่า "),
              ("ณรงค์กรณ์", "เจ้าหน้าที่ UIH คุณณรงค์กรณ์ แจ้งว่า "),
              ("จิราภรณ์", "เจ้าหน้าที่ UIH คุณจิราพร แจ้งว่า "),
          ]

          staff_start = html.index('const uihStaff=[')
          staff_end = html.index('];', staff_start)

          for marker, message in copy_targets:
              pattern = re.compile(r'(\{name:"[^"]*' + re.escape(marker) + r'[^"]*",line:"[^"]*",copy:")[^"]*("[^\n]*\})')
              html, count = pattern.subn(lambda m: m.group(1) + message + m.group(2), html)
              if count == 0 and message not in html:
                  staff_end = html.index('];', html.index('const uihStaff=['))
                  html = html[:staff_end] + '{name:"",line:"",copy:' + json.dumps(message, ensure_ascii=False) + '},\n' + html[staff_end:]

          for message, label in [
              ("เจ้าหน้าที่ UIH คุณชัยยุทธ แจ้งว่า ", "Copy ชัยยุทธ"),
              ("เจ้าหน้าที่ UIH คุณเจษฏา แจ้งว่า ", "Copy เจษฏา"),
          ]:
              if message not in html:
                  staff_end = html.index('];', html.index('const uihStaff=['))
                  row = '{name:"",line:"",copy:' + json.dumps(message, ensure_ascii=False) + ',copyLabel:' + json.dumps(label, ensure_ascii=False) + '},\n'
                  html = html[:staff_end] + row + html[staff_end:]

          advice_items = [
              {
                  "title": "ขั้นตอน Fixed IP",
                  "text": "ขั้นตอนวิธี Fixed IP ทำตามขั้นตอนนี้ครับ/ค่ะ\nกดปุ่ม Windows + R บนคีย์บอร์ด\n2.พิมพ์คำว่า ncpa.cpl และกด enter\n3.หา icon รูป Computer ที่ชื่อว่า Ethernet และกดดับเบิ้ลคลิก และเลือกที่ Properties\n4.หาคำว่า Internet Protocal Version4(TCP/ IPv4)และกดดับเบิ้ลคลิก\n5.กรอกข้อมูลตามที่เจ้าหน้าที่ Network แจ้งตามช่องทั้ง5 ช่อง\n\nรบกวนเจ้าหน้าที่ช่วย Fix IP ตามนี้ให้หน่อยครับ\nip: 10.38.17.100\nSubnetmark: 255.255.255.0\nGateway: 10.38.17.224\ndns: 10.20.100.2 \ndns: 10.26.100.2"
              },
              {
                  "title": "เปลี่ยน MAC Address",
                  "text": "วิธีทำ:\nกด Win + X → เลือก Device Manager\nไปที่ Network adapters\nคลิกขวาที่การ์ดแลน / WiFi → Properties\nไปแท็บ Advanced\nหา Network Address\nเลือก Value แล้วใส่ MAC ใหม่ (เช่น 001122334455)\nกด OK แล้ว disable/enable การ์ดใหม่\n\n📌 หมายเหตุ:\n\nห้ามใส่ - หรือ :\nใช้เลข/ตัวอักษร A–F เท่านั้น"
              },
              {
                  "title": "ข้อมูลสำหรับเข้าดำเนินการ",
                  "text": "1. CID -\n2. ที่อยู่ - \n3. วัตถุประสงค์ - \n4. สาเหตุ - \n5. พิกัด - \n6. สะดวกให้เข้าดำเนินการเมื่อไหร่ - \n7. Contact point - \n8. รูปภาพหน้างาน -"
              },
          ]

          config_items = [
              {"title": "Access Port + PortFast", "text": "switchport mode access\nswitchport access vlan 1\nspanning-tree portfast"},
              {"title": "IP Source Binding", "text": "ip source binding 6c3b.e524.91f8 vlan 2 10.36.2.134 interface PO1"},
              {"title": "Speed / Duplex", "text": "interface  Fa0/12\n speed 10\n duplex full\n------------------\ninterface Gi1/0/10\n speed auto\n duplex auto"},
              {"title": "ตรวจสอบ PoE", "text": "show power inline\nดู port poe detail"},
              {"title": "ตรวจสอบสาเหตุ Reboot", "text": "show version | i reason"},
              {"title": "Route และ Renew IP", "text": "route print\n\nroute delete 0.0.0.0 mask 0.0.0.0\nipconfig /renew\nipconfig /flushdns\nipconfig /release\n\nแล้วทำการ restart เครื่อง"},
              {"title": "Null0 Route", "text": "ip route 10.54.2.56 255.255.255.255 Null0"},
              {"title": "Drop MAC Address", "text": "mac address-table static f48e.38ab.10fe vl 514 drop"},
              {"title": "Monitor Session / SPAN", "text": "monitor session 1 source interface Gi1/0/1 - 2\nmonitor session 1 source interface Gi1/0/4 - 16\nmonitor session 1 source interface Te1/0/17 - 24\nmonitor session 1 destination interface Gi1/0/3\n\nmonitor session 1 source interface Fa0/1  - 4\nmonitor session 1 source interface Fa0/6  - 24\nmonitor session 1 destination interface Fa0/5\n\nsh monitor session 1\nsh mon\nsh int .. status\nshow running-config | include monitor"},
          ]

          data_anchor = 'let activeScript="";'
          js_data = (
              'const adviceItems=' + json.dumps(advice_items, ensure_ascii=False) + ';\n' +
              'const configItems=' + json.dumps(config_items, ensure_ascii=False) + ';\n' +
              data_anchor
          )
          if data_anchor not in html:
              raise SystemExit("activeScript anchor not found")
          html = html.replace(data_anchor, js_data, 1)

          function_anchor = 'function buildScript(type)'
          render_function = '''function renderQuickLists(){const render=(items,target,kind)=>{$(target).innerHTML=items.map((x,i)=>`<article class="message-card"><div class="message-card-head"><h3>${esc(x.title)}</h3><button class="btn gold" type="button" data-quick-kind="${kind}" data-quick-index="${i}">Copy</button></div><pre>${esc(x.text)}</pre></article>`).join("")};render(adviceItems,"#adviceList","advice");render(configItems,"#configList","config");$$('[data-quick-kind]').forEach(b=>b.onclick=()=>{const items=b.dataset.quickKind==="advice"?adviceItems:configItems;copy(items[+b.dataset.quickIndex].text)})}
          function buildScript(type)'''
          if function_anchor not in html:
              raise SystemExit("buildScript anchor not found")
          html = html.replace(function_anchor, render_function, 1)

          old_handlers = '$("#openStaffModal").onclick=()=>$("#staffModal").classList.add("open");$("#closeStaffModal").onclick=()=>$("#staffModal").classList.remove("open");$("#staffModal").onclick=e=>{if(e.target.id==="staffModal")e.currentTarget.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modal").classList.remove("open");$("#staffModal").classList.remove("open")}});'
          new_handlers = '$("#openStaffModal").onclick=()=>$("#staffModal").classList.add("open");$("#closeStaffModal").onclick=()=>$("#staffModal").classList.remove("open");$("#openAdviceModal").onclick=()=>$("#adviceModal").classList.add("open");$("#closeAdviceModal").onclick=()=>$("#adviceModal").classList.remove("open");$("#openConfigModal").onclick=()=>$("#configModal").classList.add("open");$("#closeConfigModal").onclick=()=>$("#configModal").classList.remove("open");["staffModal","adviceModal","configModal"].forEach(id=>$("#"+id).onclick=e=>{if(e.target.id===id)e.currentTarget.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")["modal","staffModal","adviceModal","configModal"].forEach(id=>$("#"+id).classList.remove("open"))});'
          if old_handlers not in html:
              raise SystemExit("Popup handler anchor not found")
          html = html.replace(old_handlers, new_handlers, 1)

          init_anchor = 'renderStaff();load();previews();renderHistory();$("#copyCount").textContent=getCopy();setInterval(previews,1000);'
          init_new = 'renderStaff();renderQuickLists();load();previews();renderHistory();$("#copyCount").textContent=getCopy();setInterval(previews,1000);'
          if init_anchor not in html:
              raise SystemExit("Initialisation anchor not found")
          html = html.replace(init_anchor, init_new, 1)

          required = [
              'id="openAdviceModal"',
              'id="openConfigModal"',
              'id="adviceList"',
              'id="configList"',
              'ข้อความใช้บ่อย',
              'monitor session 1 source interface Gi1/0/1 - 2',
              'ขั้นตอนวิธี Fixed IP',
              'เจ้าหน้าที่ UIH คุณเจษฏา แจ้งว่า ',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Missing markers: {missing}")

          path.write_text(html, encoding="utf-8")

      - name: Extract JavaScript
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/linkwork.js").write_text(html[start:end], encoding="utf-8")

      - name: Validate JavaScript
        run: node --check /tmp/linkwork.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add UIH, advice and config copy panels"
          git push
