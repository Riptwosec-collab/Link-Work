name: Add owner and LAN MA panels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-owner-lan-ma-panels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-panels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add owner and LAN MA quick-copy panels
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'id="ownerModal"' in html and 'id="lanMaModal"' in html:
              print("Owner and LAN MA panels are already installed")
              raise SystemExit(0)

          old_grid = '.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}'
          new_grid = '.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}'
          if old_grid in html:
              html = html.replace(old_grid, new_grid, 1)

          css_anchor = '.message-card .btn{flex:0 0 auto;min-width:92px}'
          css_extra = '.owner-modal{width:min(1180px,100%)}#ownerList{grid-template-columns:repeat(2,minmax(0,1fr))}.message-card.owner-card{min-height:100%}.message-card.owner-card h3{color:#ffe49b}.message-card.notice{border-color:rgba(245,201,106,.46);background:linear-gradient(145deg,rgba(79,55,8,.34),rgba(2,12,26,.96))}.message-card.alert{border-color:rgba(255,113,133,.48);background:linear-gradient(145deg,rgba(82,20,35,.34),rgba(2,12,26,.96))}@media(max-width:900px){#ownerList{grid-template-columns:1fr}}'
          if css_extra not in html:
              if css_anchor not in html:
                  raise SystemExit("CSS anchor not found")
              html = html.replace(css_anchor, css_anchor + css_extra, 1)

          config_button = '    <button class="work-link" id="openConfigModal" type="button"><span class="link-icon">CFG</span><span class="link-copy"><span class="link-name">Config ใช้บ่อย</span><span class="link-url">Cisco · Windows · Troubleshooting</span></span><span class="link-arrow" aria-hidden="true">›</span></button>'
          extra_buttons = '''    <button class="work-link" id="openOwnerModal" type="button"><span class="link-icon">PAK</span><span class="link-copy"><span class="link-name">คนดูแลแต่ละ Pak</span><span class="link-url">MA Owner · CM · PM</span></span><span class="link-arrow" aria-hidden="true">›</span></button>
    <button class="work-link" id="openLanMaModal" type="button"><span class="link-icon">LAN</span><span class="link-copy"><span class="link-name">หน่วยงานที่จุด LAN ไม่อยู่ใน MA</span><span class="link-url">รายชื่อหน่วยงาน · หมายเหตุ</span></span><span class="link-arrow" aria-hidden="true">›</span></button>'''
          if 'id="openOwnerModal"' not in html:
              if config_button not in html:
                  raise SystemExit("Config button anchor not found")
              html = html.replace(config_button, config_button + "\n" + extra_buttons, 1)

          toast_anchor = '<div class="toast" id="toast"></div>'
          modals = '''<div class="modal-bg" id="ownerModal">
  <div class="modal glass message-modal owner-modal">
    <div class="modal-top"><div><h2>คนดูแลแต่ละ Pak</h2><p class="sub">Update Owner site MA · งาน CM และ PM</p></div><button class="btn" id="closeOwnerModal" type="button">ปิด</button></div>
    <div class="message-list" id="ownerList"></div>
  </div>
</div>
<div class="modal-bg" id="lanMaModal">
  <div class="modal glass message-modal">
    <div class="modal-top"><div><h2>หน่วยงานที่จุด LAN ไม่อยู่ใน MA</h2><p class="sub">รายชื่อหน่วยงานและหมายเหตุการรับแจ้ง</p></div><button class="btn" id="closeLanMaModal" type="button">ปิด</button></div>
    <div class="message-list" id="lanMaList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>'''
          if 'id="ownerModal"' not in html:
              if toast_anchor not in html:
                  raise SystemExit("Toast anchor not found")
              html = html.replace(toast_anchor, modals, 1)

          owner_items = [
              {
                  "title": "MA OWNER - ใหม่ล่าสุด",
                  "tone": "notice",
                  "text": "Update Owner site MA\nเริ่มใช้วันที่ 29/6/2569\n\nMA OWNER - ใหม่ล่าสุด"
              },
              {
                  "title": "ผู้ดูแล: ธีรวีร์",
                  "tone": "owner-card",
                  "text": "ผู้ดูแล: ธีรวีร์\nteerawees@pccth.com\nเบอร์หลัก: 061-467-7711\nผู้ดูแลสำรอง: ธนโชติ\n\nงาน CM:\n- ดูแลงานส่วนกลางในเวลางานทั้งหมด\n- กรมสรรพากร\n- ทท.\n- ศูนย์นนท์\n- สำนักงาน\n- อาคาร Tipco\n- อาคารจอดรถ\n- อาคารที่พัก\n- ดูแลงาน CM นอกเวลางานตามเวร Standby\n\nงาน PM:\n- กองเทคโนโลยีสารสนเทศ 5\n- อาคารกรมสรรพากร 10–18\n- สำนักงบประมาณ\n- Store เมืองทอง\n- Web LAN Online\n- Server ทุกระบบงาน"
              },
              {
                  "title": "ผู้ดูแล: ธนโชติ",
                  "tone": "owner-card",
                  "text": "ผู้ดูแล: ธนโชติ\nthanachotk@pccth.com\nเบอร์หลัก: 082-135-8409\nผู้ดูแลสำรอง: ธีรวีร์\n\nงาน CM:\n- ดูแล CM ภาค 1–12\n- ดูแล CM กรุงเทพมหานคร\n- ดูแล CM จังหวัดในเวลางานทั้งหมด\n- ดูแลงาน CM นอกเวลางานตามเวร Standby\n\nงาน PM:\n- กองเทคโนโลยีสารสนเทศ 6\n- อาคารที่พัก\n- อาคารลานจอดรถ\n- อาคารกรมสรรพากร 19–27\n- ดูแลอุปกรณ์ กบภ. กับ Store Room 209\n- Web Upload และ UAT\n- Web ตรวจรับงาน\n- Web 118 และ Database"
              },
              {
                  "title": "ผู้ดูแล: สุขเกษม",
                  "tone": "owner-card",
                  "text": "ผู้ดูแล: สุขเกษม\nsukkasemn@pccth.com\nเบอร์หลัก: 086-603-3774\nผู้ดูแลสำรอง: ปิติ\nBuddy: ธีรวีร์\n\nงาน CM:\n- ดูแลสำนักงานสรรพากรต่างจังหวัดทั่วประเทศ\n- ดูแลภาค 1, 3, 5, 7, 9 และ 11\n\nงาน PM:\n- กองเทคโนโลยีสารสนเทศ 1, 2 และ 7\n- ศูนย์คอมพิวเตอร์ จังหวัดนนทบุรี\n- สนามบินน้ำ\n- อาคารกรมสรรพากร 1–5\n- ภาค 1\n- ภาค 3\n- ภาค 5\n- ภาค 7\n- ภาค 9\n- ภาค 11"
              },
              {
                  "title": "ผู้ดูแล: ปิติ",
                  "tone": "owner-card",
                  "text": "ผู้ดูแล: ปิติ\npetis@pccth.com\nเบอร์หลัก: 087-328-5540\nผู้ดูแลสำรอง: สุขเกษม\nBuddy: ธนโชติ\n\nงาน CM:\n- ดูแลสำนักงานสรรพากรต่างจังหวัดทั่วประเทศ\n- ดูแลภาค 2, 4, 6, 8, 10 และ 12\n\nงาน PM:\n- กองเทคโนโลยีสารสนเทศ 3 และ 4\n- ศูนย์คอมพิวเตอร์ จังหวัดนนทบุรี\n- สนามบินน้ำ\n- อาคารกรมสรรพากร 6–9\n- กรมสรรพากร อาคาร Tipco\n- ภาค 2\n- ภาค 4\n- ภาค 6\n- ภาค 8\n- ภาค 10\n- ภาค 12"
              }
          ]

          lan_ma_items = [
              {
                  "title": "รายชื่อหน่วยงาน",
                  "text": "สท.กทม 1\nสส.พระนคร 2\nสท.กทม 9\nสท.กทม.19\nสส.บึ่งกุ่ม\nสท.กทม.20\nสส.วังทองหลาง\nสท.สมุทรปราการ 3\nสส.บางพลี\nสท.สมุทรสาคร 2 (บางส่วน)\nสส.กระทุ่มแบน 2\nสภ.12\nสท.สงขลา 2\nสส.หาดใหญ่ 2"
              },
              {
                  "title": "หมายเหตุและวันที่อัปเดต",
                  "tone": "alert",
                  "text": "สท.สมุทรสาคร 2 สีแดงคือจุดที่เพิ่มเติมทีหลัง จากงาน MA ดำเนินการโดย ST Cyber รับแจ้งจาก PCC หากจุดใช้งานไม่ได้จะส่งช่างเข้าหน้างานเพื่อแก้ไขให้ครับ (ที่เหลือสีดำ ทางเจ้าของอาคารดำเนิการแก้ไขเอง)\n\nupdate 16/05/2568"
              }
          ]

          data_anchor = 'let activeScript="";'
          data_block = 'const ownerItems=' + json.dumps(owner_items, ensure_ascii=False) + ';\nconst lanMaItems=' + json.dumps(lan_ma_items, ensure_ascii=False) + ';\nlet activeScript="";'
          if 'const ownerItems=' not in html:
              if data_anchor not in html:
                  raise SystemExit("Data anchor not found")
              html = html.replace(data_anchor, data_block, 1)

          old_render = '''function renderQuickLists(){const render=(items,target,kind)=>{$(target).innerHTML=items.map((x,i)=>`<article class="message-card"><div class="message-card-head"><h3>${esc(x.title)}</h3><button class="btn gold" type="button" data-quick-kind="${kind}" data-quick-index="${i}">Copy</button></div><pre>${esc(x.text)}</pre></article>`).join("")};render(adviceItems,"#adviceList","advice");render(configItems,"#configList","config");$$('[data-quick-kind]').forEach(b=>b.onclick=()=>{const items=b.dataset.quickKind==="advice"?adviceItems:configItems;copy(items[+b.dataset.quickIndex].text)})}'''
          new_render = '''function renderQuickLists(){const render=(items,target,kind)=>{$(target).innerHTML=items.map((x,i)=>`<article class="message-card${x.tone?` ${esc(x.tone)}`:""}"><div class="message-card-head"><h3>${esc(x.title)}</h3><button class="btn gold" type="button" data-quick-kind="${kind}" data-quick-index="${i}">Copy</button></div><pre>${esc(x.text)}</pre></article>`).join("")};render(adviceItems,"#adviceList","advice");render(configItems,"#configList","config");render(ownerItems,"#ownerList","owner");render(lanMaItems,"#lanMaList","lanma");const groups={advice:adviceItems,config:configItems,owner:ownerItems,lanma:lanMaItems};$$('[data-quick-kind]').forEach(b=>b.onclick=()=>copy(groups[b.dataset.quickKind][+b.dataset.quickIndex].text))}'''
          if 'render(ownerItems,"#ownerList","owner")' not in html:
              if old_render not in html:
                  raise SystemExit("renderQuickLists anchor not found")
              html = html.replace(old_render, new_render, 1)

          old_handlers = '''$("#openStaffModal").onclick=()=>$("#staffModal").classList.add("open");$("#closeStaffModal").onclick=()=>$("#staffModal").classList.remove("open");$("#openAdviceModal").onclick=()=>$("#adviceModal").classList.add("open");$("#closeAdviceModal").onclick=()=>$("#adviceModal").classList.remove("open");$("#openConfigModal").onclick=()=>$("#configModal").classList.add("open");$("#closeConfigModal").onclick=()=>$("#configModal").classList.remove("open");["staffModal","adviceModal","configModal"].forEach(id=>$("#"+id).onclick=e=>{if(e.target.id===id)e.currentTarget.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")["modal","staffModal","adviceModal","configModal"].forEach(id=>$("#"+id).classList.remove("open"))});'''
          new_handlers = '''$("#openStaffModal").onclick=()=>$("#staffModal").classList.add("open");$("#closeStaffModal").onclick=()=>$("#staffModal").classList.remove("open");$("#openAdviceModal").onclick=()=>$("#adviceModal").classList.add("open");$("#closeAdviceModal").onclick=()=>$("#adviceModal").classList.remove("open");$("#openConfigModal").onclick=()=>$("#configModal").classList.add("open");$("#closeConfigModal").onclick=()=>$("#configModal").classList.remove("open");$("#openOwnerModal").onclick=()=>$("#ownerModal").classList.add("open");$("#closeOwnerModal").onclick=()=>$("#ownerModal").classList.remove("open");$("#openLanMaModal").onclick=()=>$("#lanMaModal").classList.add("open");$("#closeLanMaModal").onclick=()=>$("#lanMaModal").classList.remove("open");["staffModal","adviceModal","configModal","ownerModal","lanMaModal"].forEach(id=>$("#"+id).onclick=e=>{if(e.target.id===id)e.currentTarget.classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")["modal","staffModal","adviceModal","configModal","ownerModal","lanMaModal"].forEach(id=>$("#"+id).classList.remove("open"))});'''
          if '$("#openOwnerModal").onclick' not in html:
              if old_handlers not in html:
                  raise SystemExit("Modal handler anchor not found")
              html = html.replace(old_handlers, new_handlers, 1)

          required = [
              'id="openOwnerModal"',
              'id="openLanMaModal"',
              'id="ownerModal"',
              'id="lanMaModal"',
              'const ownerItems=',
              'const lanMaItems=',
              'render(ownerItems,"#ownerList","owner")',
              'render(lanMaItems,"#lanMaList","lanma")',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Missing markers: {missing}")

          path.write_text(html, encoding="utf-8")

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/linkwork.js").write_text(html[start:end], encoding="utf-8")

      - name: Check JavaScript syntax
        run: node --check /tmp/linkwork.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add owner and LAN MA quick-copy panels"
          git push
