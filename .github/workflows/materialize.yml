name: Materialize NOC Log Center

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/app.part*.b64"
      - "browser-tools.css"
      - "browser-tools.js"
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore standalone index.html
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip

          parts = sorted(Path("bootstrap").glob("app.part*.b64"))
          if not parts:
              raise SystemExit("No application payload parts found")

          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          html = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")

          if not html.lstrip().startswith("<!DOCTYPE html>"):
              raise SystemExit("Invalid HTML payload")
          if "NOC LOG CENTER PRO" not in html:
              raise SystemExit("Expected application title was not found")

          css = Path("browser-tools.css").read_text(encoding="utf-8")
          js = Path("browser-tools.js").read_text(encoding="utf-8").replace("</script", "<\\/script")

          if 'id="browser-tools-style"' not in html:
              html = html.replace(
                  "</head>",
                  f'  <style id="browser-tools-style">\n{css}\n</style>\n</head>',
                  1,
              )

          if 'id="browser-tools-script"' not in html:
              html = html.replace(
                  "</body>",
                  f'  <script id="browser-tools-script">\n{js}\n</script>\n</body>',
                  1,
              )

          Path("index.html").write_text(html, encoding="utf-8")
          print(f"Restored standalone index.html: {len(html):,} characters")

      - name: Commit restored source
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Materialize standalone NOC Log Center PRO"
          git push
