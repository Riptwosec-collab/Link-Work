name: Update Repair Link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-repair-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repair button URL
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          replacements = {
              "http://10.3.10.118/app68-1/admin/index.php": "http://10.3.10.118/app68-3/admin/admin.php",
              "http://10.3.10.118/app68-1/admin/admin.php": "http://10.3.10.118/app68-3/admin/admin.php",
              "App68 Admin": "แจ้งซ่อม",
          }

          changed = False
          for old, new in replacements.items():
              if old in html:
                  html = html.replace(old, new)
                  changed = True

          if changed:
              path.write_text(html, encoding="utf-8")
              print("Updated repair button URL")
          else:
              print("Repair button URL is already current")

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update repair button link"
          git push
