name: Materialize owner and LAN MA update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-owner-lan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html
        shell: bash
        run: |
          cat .linkwork-payload/part*.txt > index.html
          echo "1761b86e787e45c2c14ee286df17a77805a1a58c70ddd2076a81173b82f21279  index.html" | sha256sum -c -

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/linkwork.js").write_text(html[start:end], encoding="utf-8")

      - name: Check JavaScript syntax
        run: node --check /tmp/linkwork.js

      - name: Clean temporary files
        shell: bash
        run: |
          rm -rf .linkwork-payload
          rm -f .github/workflows/materialize-owner-lan.yml
          rm -f .github/workflows/add-owner-lan-ma-panels.yml

      - name: Commit final update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add owner and LAN MA quick-copy panels"
          git push
